name: API Gateway CI/CD

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - "services/api-gateway/**"
      - "shared/**"
      - "pom.xml"
      - ".github/workflows/api-gateway.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/api-gateway/**"
      - "shared/**"

env:
  SERVICE_NAME: api-gateway
  SERVICE_PATH: services/api-gateway
  ECR_REPOSITORY: shopsphere/api-gateway
  AWS_REGION: ap-south-1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Install parent POM
        run: mvn install -f pom.xml -N -DskipTests

      - name: Install shared modules
        run: |
          mvn install -f shared/common-dtos/pom.xml -DskipTests
          mvn install -f shared/common-exceptions/pom.xml -DskipTests
          mvn install -f shared/common-utils/pom.xml -DskipTests
          mvn install -f shared/common-events/pom.xml -DskipTests

      - name: Build API Gateway
        run: mvn package -f ${{ env.SERVICE_PATH }}/pom.xml -DskipTests

      - name: Run Tests
        run: mvn test -f ${{ env.SERVICE_PATH }}/pom.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: ${{ env.SERVICE_PATH }}/target/*.jar
          retention-days: 1

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only push images from develop and main — not from feature branches
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: api-gateway-jar
          path: ${{ env.SERVICE_PATH }}/target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            ${{ env.SERVICE_PATH }}

      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy api-gateway to staging EKS"
          # kubectl set image deployment/api-gateway api-gateway=...
          # Will be implemented in Kubernetes session

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploy api-gateway to prod EKS"
          # kubectl set image deployment/api-gateway api-gateway=...
          # Will be implemented in Kubernetes session
