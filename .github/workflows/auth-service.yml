name: Auth Service CI/CD

on:
  push:
    branches: [main, develop, feature/auth-service]
    paths:
      - "services/auth-service/**"
      - "shared/common-dtos/**"
      - "shared/common-exceptions/**"
      - "shared/common-utils/**"
      - "shared/common-events/**"
      - "pom.xml"
      - ".github/workflows/auth-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/auth-service/**"
      - "shared/common-dtos/**"
      - "shared/common-exceptions/**"
      - "shared/common-utils/**"
      - "shared/common-events/**"
      - "pom.xml"
      - ".github/workflows/auth-service.yml"

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: shopsphere/auth-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auth_db_test
          POSTGRES_USER: shopsphere
          POSTGRES_PASSWORD: shopsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build shared libraries
        run: |
          mvn install -f pom.xml -N -DskipTests -q
          mvn install -f shared/common-dtos/pom.xml -DskipTests -q
          mvn install -f shared/common-exceptions/pom.xml -DskipTests -q
          mvn install -f shared/common-utils/pom.xml -DskipTests -q
          mvn install -f shared/common-events/pom.xml -DskipTests -q

      - name: Build & test auth-service
        run: mvn verify -f services/auth-service/pom.xml
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/auth_db_test
          SPRING_DATASOURCE_USERNAME: shopsphere
          SPRING_DATASOURCE_PASSWORD: shopsphere
          SPRING_CLOUD_CONFIG_ENABLED: "false"
          EUREKA_CLIENT_ENABLED: "false"
          JWT_PRIVATE_KEY: ${{ secrets.AUTH_SERVICE_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.AUTH_SERVICE_JWT_PUBLIC_KEY }}
          JWT_ACCESS_TOKEN_EXPIRATION_MS: "900000"
          JWT_REFRESH_TOKEN_EXPIRATION_DAYS: "7"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: services/auth-service/target/surefire-reports/

  docker-build-and-push:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --file services/auth-service/Dockerfile \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          else
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:develop
          fi

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          else
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:develop
          fi

      - name: Output image digest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
