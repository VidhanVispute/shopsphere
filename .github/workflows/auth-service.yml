name: Auth Service CI/CD

on:
  push:
    branches: [main, develop, feature/auth-service]
    paths:
      - "services/auth-service/**"
      - "shared/common-dtos/**"
      - "shared/common-exceptions/**"
      - "shared/common-utils/**"
      - "shared/common-events/**"
      - "pom.xml"
      - ".github/workflows/auth-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/auth-service/**"
      - "shared/common-dtos/**"
      - "shared/common-exceptions/**"
      - "shared/common-utils/**"
      - "shared/common-events/**"
      - "pom.xml"
      - ".github/workflows/auth-service.yml"

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: shopsphere/auth-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Job 1: Build & Test ──────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auth_db_test
          POSTGRES_USER: shopsphere
          POSTGRES_PASSWORD: shopsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build shared libraries
        run: |
          mvn install -f pom.xml -N -DskipTests -q
          mvn install -f shared/common-dtos/pom.xml -DskipTests -q
          mvn install -f shared/common-exceptions/pom.xml -DskipTests -q
          mvn install -f shared/common-utils/pom.xml -DskipTests -q
          mvn install -f shared/common-events/pom.xml -DskipTests -q

      - name: Build & test auth-service
        run: mvn verify -f services/auth-service/pom.xml
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/auth_db_test
          SPRING_DATASOURCE_USERNAME: shopsphere
          SPRING_DATASOURCE_PASSWORD: shopsphere
          SPRING_CLOUD_CONFIG_ENABLED: "false"
          EUREKA_CLIENT_ENABLED: "false"
          JWT_PRIVATE_KEY: ${{ secrets.AUTH_SERVICE_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.AUTH_SERVICE_JWT_PUBLIC_KEY }}
          JWT_ACCESS_TOKEN_EXPIRATION_MS: "900000"
          JWT_REFRESH_TOKEN_EXPIRATION_DAYS: "7"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: services/auth-service/target/surefire-reports/

  # ── Job 2: Docker Build & Push (develop + main only) ────────────────────────
  docker-build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only push images on develop and main — not on feature branches or PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          # develop branch → "develop" tag + commit sha
          # main branch    → "latest" tag + commit sha + semver if tagged
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tags=$ECR_REGISTRY/$ECR_REPOSITORY:latest,$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          else
            echo "tags=$ECR_REGISTRY/$ECR_REPOSITORY:develop,$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          docker build \
            --file services/auth-service/Dockerfile \
            --tag ${{ steps.meta.outputs.tags }} \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .

      - name: Push Docker image to ECR
        run: |
          # Push all tags (handles the comma-separated list)
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
            docker push $tag
          done

      - name: Output image digest
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker inspect --format='{{index .RepoDigests 0}}' \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
