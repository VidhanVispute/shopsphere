name: Config Server CI/CD

on:
  push:
    branches: [main, develop, "feature/**"]
    paths:
      - "services/infrastructure-services/config-server/**"
      - "shared/**"
      - ".github/workflows/config-server.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/infrastructure-services/config-server/**"
      - "shared/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: shopsphere-config-server
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build shared modules
        run: |
          mvn install -f shared/common-dtos/pom.xml -DskipTests
          mvn install -f shared/common-exceptions/pom.xml -DskipTests
          mvn install -f shared/common-utils/pom.xml -DskipTests
          mvn install -f shared/common-events/pom.xml -DskipTests

      - name: Build Config Server
        run: mvn package -f services/infrastructure-services/config-server/pom.xml -DskipTests

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build JAR
        run: |
          mvn install -f shared/common-dtos/pom.xml -DskipTests
          mvn install -f shared/common-exceptions/pom.xml -DskipTests
          mvn install -f shared/common-utils/pom.xml -DskipTests
          mvn install -f shared/common-events/pom.xml -DskipTests
          mvn package -f services/infrastructure-services/config-server/pom.xml -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f services/infrastructure-services/config-server/Dockerfile \
            services/infrastructure-services/config-server
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
