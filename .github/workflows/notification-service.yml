name: Notification Service CI

on:
  push:
    branches: [develop, main]
    paths:
      - "services/support-services/notification-service/**"
      - "shared/**"
      - ".github/workflows/notification-service.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "services/support-services/notification-service/**"
      - "shared/**"
      - ".github/workflows/notification-service.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Install parent POM
        run: mvn install -N -DskipTests

      - name: Install shared modules
        run: mvn install -pl shared/common-dtos,shared/common-exceptions -DskipTests

      - name: Build notification-service
        run: mvn -pl services/support-services/notification-service clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build -t notification-service:${{ github.sha }} \
            -f services/support-services/notification-service/Dockerfile \
            services/support-services/notification-service/

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: notification-service:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=notification-service
          IMAGE_TAG=${{ github.sha }}
          docker tag notification-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag notification-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
