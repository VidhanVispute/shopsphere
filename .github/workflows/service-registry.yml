name: Service Registry CI/CD

on:
  push:
    branches: [main, develop, "feature/**"]
    paths:
      - "services/infrastructure-services/service-registry/**"
      - "shared/**"
      - ".github/workflows/service-registry.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/infrastructure-services/service-registry/**"
      - "shared/**"
      - ".github/workflows/service-registry.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: shopsphere/service-registry
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build shared libraries
        run: |
          mvn install -f pom.xml -N -DskipTests -q
          mvn install -f shared/common-dtos/pom.xml -DskipTests -q
          mvn install -f shared/common-exceptions/pom.xml -DskipTests -q
          mvn install -f shared/common-utils/pom.xml -DskipTests -q
          mvn install -f shared/common-events/pom.xml -DskipTests -q

      - name: Build service-registry
        run: mvn package -f services/infrastructure-services/service-registry/pom.xml -DskipTests

  docker-build-and-push:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build JAR
        run: |
          mvn install -f pom.xml -N -DskipTests -q
          mvn install -f shared/common-dtos/pom.xml -DskipTests -q
          mvn install -f shared/common-exceptions/pom.xml -DskipTests -q
          mvn install -f shared/common-utils/pom.xml -DskipTests -q
          mvn install -f shared/common-events/pom.xml -DskipTests -q
          mvn package -f services/infrastructure-services/service-registry/pom.xml -DskipTests -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --file services/infrastructure-services/service-registry/Dockerfile \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            services/infrastructure-services/service-registry
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          else
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:develop
          fi

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          else
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:develop
          fi
