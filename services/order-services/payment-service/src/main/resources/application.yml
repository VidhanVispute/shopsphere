server:
  port: 8087

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
