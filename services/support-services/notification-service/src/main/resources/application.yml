server:
  port: 8088

spring:
  application:
    name: notification-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:shopsphere}
    password: ${RABBITMQ_PASSWORD:shopsphere123}

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: ${DB_USERNAME:shopsphere}
    password: ${DB_PASSWORD:shopsphere123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info

sendgrid:
  api-key: ${SENDGRID_API_KEY}
  from-email: ${SENDGRID_FROM_EMAIL:vispute.vidhan.it@gmail.com}
  from-name: ShopSphere

app:
  rabbitmq:
    exchange: shopsphere.events
    queue:
      notification: notification.queue
    routing-key:
      order-placed: order.placed
      order-confirmed: order.confirmed
      order-cancelled: order.cancelled

